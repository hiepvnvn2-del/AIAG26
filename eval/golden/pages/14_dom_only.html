<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>DOM Only — Không có JSON-LD</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#1e293b;padding:24px}
  .pricing-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:900px}
  .plan{background:#fff;border-radius:12px;padding:24px;border:1px solid #e2e8f0}
  .plan-name{font-size:16px;font-weight:600;margin-bottom:8px}
  .plan-price{font-size:32px;font-weight:700;color:#2563eb}
  .plan-cycle{font-size:13px;color:#64748b;margin-bottom:12px}
  .plan-feature{font-size:13px;color:#475569;margin:4px 0}
  .plan-badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:600;margin-bottom:8px}
  .badge-out{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
  <h1>Chọn gói phù hợp với bạn</h1>
  <div class="pricing-grid">
    <div class="plan">
      <div class="plan-badge">Còn hàng</div>
      <div class="plan-name">Economy</div>
      <div class="plan-price">169.000</div>
      <div class="plan-cycle">đ / tháng</div>
      <div class="plan-feature">✓ 1 website</div>
      <div class="plan-feature">✓ 10GB SSD</div>
      <div class="plan-feature">✓ SSL miễn phí</div>
    </div>
    <div class="plan">
      <div class="plan-badge">Còn hàng</div>
      <div class="plan-name">Deluxe</div>
      <div class="plan-price">320.000</div>
      <div class="plan-cycle">đ / tháng</div>
      <div class="plan-feature">✓ 10 website</div>
      <div class="plan-feature">✓ 30GB SSD</div>
      <div class="plan-feature">✓ Backup hàng ngày</div>
    </div>
    <div class="plan">
      <div class="plan-badge badge-out">Hết hàng</div>
      <div class="plan-name">Ultimate</div>
      <div class="plan-price">620.000</div>
      <div class="plan-cycle">đ / tháng</div>
      <div class="plan-feature">✓ Unlimited website</div>
      <div class="plan-feature">✓ 100GB SSD NVMe</div>
      <div class="plan-feature">✓ Priority support</div>
    </div>
  </div>
</body>
</html>
