<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>HostVN — Hosting WordPress</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0}
  main{padding:24px;max-width:960px;margin:0 auto}
  .card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:16px}
  .price{font-size:28px;font-weight:700;color:#38bdf8}
  .badge{display:inline-block;background:#059669;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
  .badge.low{background:#d97706}
  .muted{color:#94a3b8;font-size:13px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
  .modal{background:#fff;color:#0f172a;border-radius:16px;padding:28px;max-width:400px;width:90%}
  .modal-close{float:right;border:0;background:transparent;font-size:24px;cursor:pointer}
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "itemListElement": [
    {
      "@type": "Product",
      "name": "Hosting WordPress Starter",
      "offers": {"@type": "Offer", "price": "199000", "priceCurrency": "VND", "availability": "https://schema.org/InStock"}
    },
    {
      "@type": "Product",
      "name": "Hosting WordPress Business",
      "offers": {"@type": "Offer", "price": "590000", "priceCurrency": "VND", "availability": "https://schema.org/InStock"}
    }
  ]
}
</script>
</head>
<body>
<main>
  <div class="card">
    <div>Hosting WordPress <b>Starter</b> <span class="badge">Còn hàng</span></div>
    <div class="price">199.000đ/tháng</div>
    <div class="muted">1 website · 5GB SSD · SSL miễn phí</div>
  </div>
  <div class="card">
    <div>Hosting WordPress <b>Business</b> <span class="badge low">Sắp hết</span></div>
    <div class="price">590.000đ/tháng</div>
    <div class="muted">20 website · 60GB SSD · SSL · Backup realtime</div>
  </div>
</main>

<!-- Cookie banner covering the page -->
<div class="modal-bg" id="cookieBanner">
  <div class="modal">
    <button class="modal-close" id="closeBanner">×</button>
    <h2>🍪 Chúng tôi dùng cookie</h2>
    <p>Website này dùng cookie để cải thiện trải nghiệm của bạn.</p>
    <button id="acceptCookie" style="background:#2563eb;color:#fff;border:0;padding:10px 20px;border-radius:8px;cursor:pointer">Đồng ý</button>
    <button id="rejectCookie" style="background:#e2e8f0;color:#0f172a;border:0;padding:10px 20px;border-radius:8px;cursor:pointer;margin-left:8px">Từ chối</button>
  </div>
</div>
<script>
  document.getElementById('closeBanner').onclick =
  document.getElementById('acceptCookie').onclick =
  document.getElementById('rejectCookie').onclick = () => {
    document.getElementById('cookieBanner').style.display = 'none';
  };
</script>
</body>
</html>
